<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c3aed">
    <title>Pick & Answer V2.0</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #100d1c;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 35px auto;
            text-align: center;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            color: #c4b5fd;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .card {
            background: #211b35;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #40345c;
            margin-bottom: 20px;
        }

        input, button, select {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border-radius: 10px;
            font-size: 16px;
        }

        input, select {
            border: 1px solid #574775;
            background: #151023;
            color: white;
        }

        button {
            border: none;
            background: #8b5cf6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .secondary {
            background: #37304a;
        }

        .question {
            font-size: 22px;
            line-height: 1.5;
            margin: 25px 0;
        }

        .category {
            display: inline-block;
            background: #3b2d59;
            color: #ddd6fe;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .footer {
            margin-top: 25px;
            color: #9ca3af;
            font-size: 13px;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo">💜🎮</div>
        <h1>Pick & Answer</h1>

        <p class="subtitle">
            Pick a question. Share your answer.
            Discover something new about each other.
        </p>

        <section class="card" id="setupCard">
            <h2>Let's Play!</h2>

            <input
                type="text"
                id="playerName"
                placeholder="Enter your name"
                maxlength="25"
            >

            <label for="categorySelect">Choose a category</label>

            <select id="categorySelect">
                <option value="All">All Questions</option>
                <option value="Love & Relationships">Love & Relationships</option>
                <option value="Flirty">Flirty</option>
                <option value="Deep & Emotional">Deep & Emotional</option>
                <option value="Funny">Funny</option>
            </select>

            <button onclick="startGame()">Start Game</button>
        </section>

        <section class="card" id="gameCard" hidden>
            <span class="category" id="questionCategory"></span>

            <p id="turnIndicator"></p>

            <div class="question" id="questionText">
                Your question will appear here.
            </div>

            <button onclick="skipQuestion()">Next Question</button>

            <button class="secondary" onclick="showSetup()">
                Back to Setup
            </button>
        </section>

        <p class="footer">
            Pick & Answer V2.0 · Made for two players 💜
        </p>
    </main>

    <script src="questions.js"></script>
    <script src="game.js"></script>

    <script>
        function startGame() {
            const name = document.getElementById("playerName").value.trim();

            if (!name) {
                alert("Please enter your name first.");
                return;
            }

            currentCategory =
                document.getElementById("categorySelect").value;

            playerTurn = 1;
            usedQuestions = [];

            document.getElementById("setupCard").hidden = true;

            nextQuestion();
        }

        function showSetup() {
            document.getElementById("gameCard").hidden = true;
            document.getElementById("setupCard").hidden = false;
        }
    </script>
</body>
</html>
